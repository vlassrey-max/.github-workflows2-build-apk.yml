name: Create Project & Build APK

on:
  workflow_dispatch:          # ручной запуск
  push:
    branches: [ main, master ]

jobs:
  create-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create full Android project
        run: |
          set -e

          ############################################
          # Root files
          ############################################
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PriceHunter"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          android.defaults.buildfeatures.buildconfig=true
          EOF

          ############################################
          # app/build.gradle
          ############################################
          mkdir -p app
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.pricehunter'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.pricehunter"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildFeatures {
                  viewBinding true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }

              packaging {
                  resources {
                      excludes += '/META-INF/{AL2.0,LGPL2.1}'
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'

              // CameraX
              def camerax = "1.3.1"
              implementation "androidx.camera:camera-core:$camerax"
              implementation "androidx.camera:camera-camera2:$camerax"
              implementation "androidx.camera:camera-lifecycle:$camerax"
              implementation "androidx.camera:camera-view:$camerax"

              // ML Kit Text Recognition
              implementation "com.google.mlkit:text-recognition:16.0.0"

              // Location
              implementation "com.google.android.gms:play-services-location:21.2.0"

              // Network (mock)
              implementation "com.squareup.retrofit2:retrofit:2.9.0"
              implementation "com.squareup.retrofit2:converter-gson:2.9.0"

              // Coroutines
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3"
          }
          EOF

          ############################################
          # AndroidManifest.xml
          ############################################
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />

              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="PriceHunter"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          ############################################
          # MainActivity.kt
          ############################################
          mkdir -p app/src/main/java/com/example/pricehunter
          cat > app/src/main/java/com/example/pricehunter/MainActivity.kt << 'EOF'
          package com.example.pricehunter

          import android.Manifest
          import android.content.pm.PackageManager
          import android.graphics.BitmapFactory
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.example.pricehunter.analyzer.ProductAnalyzer
          import com.example.pricehunter.databinding.ActivityMainBinding
          import com.example.pricehunter.network.PriceItem
          import com.example.pricehunter.network.PriceRepository
          import com.google.android.gms.location.FusedLocationProviderClient
          import com.google.android.gms.location.LocationServices
          import com.google.android.gms.location.Priority
          import com.google.android.gms.tasks.CancellationTokenSource
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.tasks.await
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var imageCapture: ImageCapture? = null
              private lateinit var fusedLocationClient: FusedLocationProviderClient
              private val analyzer = ProductAnalyzer()
              private val repository = PriceRepository()

              private val permissionsLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { result ->
                  if (result[Manifest.permission.CAMERA] == true) {
                      startCamera()
                  } else {
                      updateStatus("Нет доступа к камере", true)
                  }
                  if (result[Manifest.permission.ACCESS_FINE_LOCATION] != true) {
                      Toast.makeText(this, "Без геолокации результаты будут приблизительными", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  fusedLocationClient = LocationServices.getFusedLocationProviderClient(this)
                  binding.rvPrices.layoutManager = LinearLayoutManager(this)
                  binding.rvPrices.adapter = PriceAdapter()

                  val needed = arrayOf(
                      Manifest.permission.CAMERA,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  val missing = needed.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isEmpty()) startCamera() else permissionsLauncher.launch(missing.toTypedArray())

                  binding.btnCapture.setOnClickListener { capture() }
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val provider = future.get()
                          val preview = Preview.Builder().build().also {
                              it.surfaceProvider = binding.cameraPreview.surfaceProvider
                          }
                          imageCapture = ImageCapture.Builder()
                              .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                              .build()

                          provider.unbindAll()
                          provider.bindToLifecycle(
                              this,
                              CameraSelector.DEFAULT_BACK_CAMERA,
                              preview,
                              imageCapture
                          )
                          updateStatus("Наведите камеру на товар")
                      } catch (e: Exception) {
                          updateStatus("Камера недоступна: ${e.message}", true)
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun capture() {
                  val cap = imageCapture ?: return
                  showLoading(true)
                  updateStatus("Обрабатываю снимок…")

                  val file = File(
                      cacheDir,
                      SimpleDateFormat("HHmmss", Locale.US).format(System.currentTimeMillis()) + ".jpg"
                  )

                  val options = ImageCapture.OutputFileOptions.Builder(file).build()
                  cap.takePicture(
                      options,
                      ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onError(e: ImageCaptureException) {
                              updateStatus("Ошибка съёмки: ${e.message}", true)
                              showLoading(false)
                          }
                          override fun onImageSaved(out: ImageCapture.OutputFileResults) {
                              process(file)
                          }
                      }
                  )
              }

              private fun process(file: File) {
                  lifecycleScope.launch {
                      try {
                          val bitmap = BitmapFactory.decodeFile(file.absolutePath)
                              ?: error("Не удалось прочитать изображение")

                          val product = analyzer.analyze(bitmap).getOrElse {
                              updateStatus("Товар не распознан. Поднесите ближе и повторите.", true)
                              return@launch
                          }
                          updateStatus("Распознано: ${product.brand} ${product.productName}")

                          val loc = currentLocation()
                          val lat = loc?.latitude ?: 55.75
                          val lon = loc?.longitude ?: 37.62

                          val prices = repository.getPrices(product.productName, lat, lon).getOrElse {
                              updateStatus("Ошибка загрузки цен: ${it.message}", true)
                              return@launch
                          }

                          if (prices.isEmpty()) {
                              updateStatus("Предложений не найдено")
                          } else {
                              updateStatus("Найдено предложений: ${prices.size}")
                              (binding.rvPrices.adapter as PriceAdapter).submit(prices)
                          }
                      } catch (e: Exception) {
                          updateStatus("Ошибка: ${e.message}", true)
                      } finally {
                          file.delete()
                          showLoading(false)
                      }
                  }
              }

              private suspend fun currentLocation() = try {
                  fusedLocationClient.getCurrentLocation(
                      Priority.PRIORITY_BALANCED_POWER_ACCURACY,
                      CancellationTokenSource().token
                  ).await()
              } catch (e: Exception) {
                  null
              }

              private fun updateStatus(text: String, error: Boolean = false) {
                  binding.tvStatus.text = text
                  binding.tvStatus.setTextColor(
                      if (error) 0xFFFF5252.toInt() else 0xFFFFFFFF.toInt()
                  )
              }

              private fun showLoading(show: Boolean) {
                  binding.progressBar.visibility = if (show) View.VISIBLE else View.GONE
                  binding.btnCapture.isEnabled = !show
              }

              // ---------------- Adapter ----------------
              class PriceAdapter : RecyclerView.Adapter<PriceAdapter.VH>() {
                  private var items: List<PriceItem> = emptyList()

                  fun submit(new: List<PriceItem>) {
                      items = new
                      notifyDataSetChanged()
                  }

                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val store: TextView = v.findViewById(R.id.tvStore)
                      val price: TextView = v.findViewById(R.id.tvPrice)
                      val address: TextView = v.findViewById(R.id.tvAddress)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val view = LayoutInflater.from(parent.context)
                          .inflate(R.layout.item_price, parent, false)
                      return VH(view)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val item = items[position]
                      holder.store.text = "${item.storeName} · ${item.distance} км"
                      holder.price.text = "%.2f ₽".format(item.price)
                      holder.address.text = item.address
                  }

                  override fun getItemCount() = items.size
              }
          }
          EOF

          ############################################
          # ProductAnalyzer.kt
          ############################################
          mkdir -p app/src/main/java/com/example/pricehunter/analyzer
          cat > app/src/main/java/com/example/pricehunter/analyzer/ProductAnalyzer.kt << 'EOF'
          package com.example.pricehunter.analyzer

          import android.graphics.Bitmap
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlin.coroutines.resume

          data class ProductInfo(
              val brand: String,
              val productName: String
          )

          class ProductAnalyzer {
              private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

              suspend fun analyze(bitmap: Bitmap): Result<ProductInfo> =
                  suspendCancellableCoroutine { cont ->
                      val image = InputImage.fromBitmap(bitmap, 0)
                      recognizer.process(image)
                          .addOnSuccessListener { visionText ->
                              val info = extract(visionText.text)
                              cont.resume(
                                  if (info != null) Result.success(info)
                                  else Result.failure(Exception("Текст не найден"))
                              )
                          }
                          .addOnFailureListener { e ->
                              cont.resume(Result.failure(e))
                          }
                  }

              private fun extract(raw: String): ProductInfo? {
                  val lines = raw.split("\n")
                      .map { it.trim() }
                      .filter { it.length > 2 }
                  if (lines.isEmpty()) return null
                  val brand = lines[0]
                  val product = lines.getOrNull(1) ?: brand
                  return ProductInfo(brand, product)
              }
          }
          EOF

          ############################################
          # PriceRepository.kt
          ############################################
          mkdir -p app/src/main/java/com/example/pricehunter/network
          cat > app/src/main/java/com/example/pricehunter/network/PriceRepository.kt << 'EOF'
          package com.example.pricehunter.network

          import kotlinx.coroutines.delay

          data class PriceItem(
              val storeName: String,
              val price: Double,
              val address: String,
              val distance: Double
          )

          class PriceRepository {
              // Пока заглушка. Позже можно заменить на реальный API.
              suspend fun getPrices(product: String, lat: Double, lon: Double): Result<List<PriceItem>> {
                  return try {
                      delay(800) // имитация сети
                      Result.success(
                          listOf(
                              PriceItem("Пятёрочка", 119.90, "ул. Ленина, 15", 0.4),
                              PriceItem("Магнит", 114.50, "пр. Мира, 22", 0.8),
                              PriceItem("Перекрёсток", 132.00, "ул. Садовая, 5", 1.2),
                              PriceItem("Лента", 109.99, "ш. Энтузиастов, 3", 1.9)
                          )
                      )
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }
          }
          EOF

          ############################################
          # Layouts
          ############################################
          mkdir -p app/src/main/res/layout

          # activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.camera.view.PreviewView
                  android:id="@+id/cameraPreview"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toTopOf="@id/bottomPanel"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_margin="12dp"
                  android:background="#99000000"
                  android:padding="10dp"
                  android:text="Наведите камеру на товар"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <ProgressBar
                  android:id="@+id/progressBar"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="@id/cameraPreview"
                  app:layout_constraintBottom_toBottomOf="@id/cameraPreview"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <LinearLayout
                  android:id="@+id/bottomPanel"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:background="#111111"
                  android:padding="12dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <ImageButton
                      android:id="@+id/btnCapture"
                      android:layout_width="72dp"
                      android:layout_height="72dp"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginBottom="12dp"
                      android:background="@android:drawable/btn_default"
                      android:contentDescription="Сфотографировать"
                      android:src="@android:drawable/ic_menu_camera"
                      android:scaleType="centerInside" />

                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/rvPrices"
                      android:layout_width="match_parent"
                      android:layout_height="180dp"
                      android:clipToPadding="false" />
              </LinearLayout>

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # item_price.xml
          cat > app/src/main/res/layout/item_price.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="10dp"
              android:background="#1A1A1A"
              android:layout_marginBottom="6dp">

              <TextView
                  android:id="@+id/tvStore"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvPrice"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#4CAF50"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:layout_marginTop="2dp" />

              <TextView
                  android:id="@+id/tvAddress"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#AAAAAA"
                  android:textSize="13sp"
                  android:layout_marginTop="2dp" />
          </LinearLayout>
          EOF

          ############################################
          # Minimal resources
          ############################################
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">PriceHunter</string>
          </resources>
          EOF

          echo "=== Project structure created successfully ==="
          find . -type f | head -40

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type all || true
          # Fallback if gradle not preinstalled
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
            unzip -q gradle.zip
            ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceHunter-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
